services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - dados:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  dados:
  caddy_data:
